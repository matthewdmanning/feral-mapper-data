[project]
name = "feral-mapper-data"
version = "0.1.0"
description = "Data backend for feral cat population models: geospatial layers onto road-graph edges, homogeneous-area coarsening, GeoSPARQL export."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "affine>=2.4",
    "exactextract>=0.3",
    "geopandas>=1.0",
    "networkx>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "scipy>=1.13",
    "shapely>=2.0",
]

[project.optional-dependencies]
osm = ["osmnx>=2.0"]
rdf = ["rdflib>=7.1"]

[project.scripts]
feral-edges = "feral_mapper_data.app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
